<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Choose a Fieldnotes Skills catalog for OpenCode, with or without Android. Browse the workflows and connect a Git or SVN project."
    />
    <title>Fieldnotes Skills · Catalog</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="catalog.js"></script>
    <script defer src="page.js"></script>
  </head>
  <body>
    <header>
      <div class="wrap top">
        <a class="brand" href="#intro"
          ><i aria-hidden="true">F</i> Fieldnotes</a
        >
        <nav>
          <a href="#catalog" id="nav-list"></a
          ><a href="#setup" id="nav-setup"></a
          ><a href="https://github.com/StrangePers/fieldnotes-skills"
            >GitHub ↗</a
          ><a id="language" href="?lang=ru" hreflang="ru">RU</a>
        </nav>
      </div>
    </header>
    <main class="wrap">
      <section class="hero" id="intro">
        <div class="lead">
          <h1>Fieldnotes<br />Skills<span>.</span></h1>
          <p id="intro-text"></p>
          <a class="action" href="#setup" id="cta"></a>
        </div>
        <div class="folio">
          <div class="sheet">
            <div class="sheet-top">
              <span id="edition"></span
              ><span class="lines" aria-hidden="true"></span>
            </div>
            <div class="count" aria-live="polite">
              <strong id="count"></strong><span id="unit"></span>
            </div>
            <fieldset>
              <legend id="choose"></legend>
              <div class="modes">
                <label
                  ><input type="radio" name="mode" value="core" /><span
                    id="core-label"
                  ></span></label
                ><label
                  ><input type="radio" name="mode" value="android" /><span
                    id="android-label"
                  ></span
                ></label>
              </div>
            </fieldset>
            <p id="mode-note"></p>
          </div>
        </div>
      </section>
      <section class="section" id="catalog">
        <div class="section-head">
          <h2 id="catalog-title"></h2>
          <span id="catalog-meta"></span>
        </div>
        <p id="catalog-note"></p>
        <div id="groups"></div>
      </section>
      <section class="section" id="setup">
        <div class="section-head">
          <h2 id="setup-title"></h2>
          <span>OpenCode / PowerShell</span>
        </div>
        <p id="setup-intro"></p>
        <div class="steps" id="steps"></div>
        <div id="optional"></div>
      </section>
    </main>
    <footer class="wrap">
      <span>Fieldnotes Skills · StrangePers</span
      ><a
        href="https://github.com/StrangePers/fieldnotes-skills/blob/main/LICENSE"
        >CC BY 4.0 ↗</a
      >
    </footer>
    <noscript
      ><p>
        JavaScript enables catalog selection.
        <a
          href="https://github.com/StrangePers/fieldnotes-skills#standalone-catalog-in-opencode"
          >Read the standalone setup guide on GitHub.</a
        >
      </p></noscript
    >
  </body>
</html>
